name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  pmb-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m py_compile integrations/pmb_sync.py
      - run: python -m pytest -q
